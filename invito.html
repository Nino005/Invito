<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un invito per te</title>
<style>
:root{--bg:#fbe9ef;--card:#fffafb;--ink:#4a0d26;--soft:#8a5a6b;--pink:#e63f7d;--pink2:#f7b6cd;--line:#f0cfda;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0f1b;--card:#3a1626;--ink:#ffe6ef;--soft:#d9a3b8;--pink:#ff5c95;--pink2:#7a2e4a;--line:#5a2840}}
:root[data-theme="dark"]{--bg:#2a0f1b;--card:#3a1626;--ink:#ffe6ef;--soft:#d9a3b8;--pink:#ff5c95;--pink2:#7a2e4a;--line:#5a2840}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Inter,system-ui,sans-serif;display:flex;justify-content:center;padding:20px}
.wrap{width:100%;max-width:440px;margin:auto}
.brand{font-weight:700;color:var(--pink);margin:0 4px 10px;display:flex;justify-content:space-between;font-size:14px}
.bar{height:4px;background:var(--line);border-radius:4px;margin:0 4px 14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .4s}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:34px 24px 28px;text-align:center;min-height:400px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;position:relative;overflow:hidden}
h1{font-size:clamp(30px,9vw,40px);line-height:1.05;letter-spacing:-.03em;margin:0;font-weight:800}
p{margin:0;color:var(--soft);font-size:15px;line-height:1.4}
button,input,select{font:inherit}
.btn{background:var(--pink);color:#fff;border:0;border-radius:99px;padding:14px 30px;font-weight:700;font-size:16px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ghost{background:var(--pink2);color:var(--ink)}
.row{display:flex;gap:14px;align-items:center;justify-content:center;min-height:120px;width:100%;position:relative}
.fld{width:100%;text-align:left;display:grid;gap:6px}
.fld label{font-size:13px;font-weight:600;color:var(--soft)}
input,select{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opt{padding:14px 8px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--pink);background:var(--pink2)}
.big{font-size:52px}
.doc{width:100%;text-align:left;border:1px dashed var(--pink);border-radius:18px;padding:16px;background:var(--bg);display:grid;gap:8px;font-size:14px}
.doc b{display:flex;justify-content:space-between;gap:10px}
.doc small{color:var(--soft)}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span>♥ Un invito per te</span><span id="stepn"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card" aria-live="polite"></div>
</div>
<script>
// ====== PERSONALIZZA QUI ======
var CFG = {
  nome: "Sabina",          // il nome di chi riceve l'invito
  tuoNome: "Antonio",      // il tuo nome
  orari: ["18:00","19:00","20:00","21:00"],
  cibi: ["🍕 Pizza","🍣 Sushi","🍔 Burger","🍝 Pasta","🥩 Bisteccheria","🥙 Kebab"]
};
// ==============================
var S = {data:"",ora:"",cibo:"",dove:""}, step=0, card=document.getElementById("card");
var noTexts=["No","Sicura?","Ripensaci…","Dai su 🥺","Ultima chance"], noI=0;
function prog(){document.getElementById("prog").style.width=(step/5*100)+"%";document.getElementById("stepn").textContent=(step<5?(step+1)+" / 6":"6 / 6")}
function go(n){step=n;render()}
function render(){
  prog();
  if(step===0){
    card.innerHTML='<p>Una domanda importante, ' + CFG.nome + '</p><h1>Usciresti con me?</h1><p>Sii sincera. C\'è una sola risposta giusta, ovviamente.</p><div class="row"><button class="btn" id="yes">Sì 💗</button><button class="btn ghost" id="no">No</button></div>';
    document.getElementById("yes").onclick=function(){go(1)};
    var no=document.getElementById("no");
    function dodge(e){e.preventDefault();noI=Math.min(noI+1,noTexts.length-1);no.textContent=noTexts[noI];
      var r=card.getBoundingClientRect(),x=Math.random()*(r.width-120)-(r.width/2-60),y=Math.random()*80-40;
      no.style.position="relative";no.style.transform="translate("+x+"px,"+y+"px)";
      var y2=document.getElementById("yes");y2.style.transform="scale("+(1+noI*.12)+")"}
    no.addEventListener("mouseenter",dodge);no.addEventListener("touchstart",dodge);no.addEventListener("click",dodge);
  }
  if(step===1){
    card.innerHTML='<div class="big">🎉</div><h1>Aspetta, hai detto DAVVERO sì??</h1><p>Non ero pronto per questa cosa 😭</p><button class="btn" id="n">Ok, organizziamo</button>';
    document.getElementById("n").onclick=function(){go(2)};
  }
  if(step===2){
    card.innerHTML='<h1>Allora… quando sei libera?</h1><p>Scegli un giorno e un orario carini.</p><div class="fld"><label for="d">Giorno</label><input type="date" id="d"></div><div class="fld"><label for="o">Orario</label><select id="o"><option value="">Scegli un orario</option>'+CFG.orari.map(function(o){return '<option>'+o+'</option>'}).join("")+'<option>Quando vuoi, ho tempo</option></select></div><button class="btn" id="n" disabled>Avanti</button>';
    var d=document.getElementById("d"),o=document.getElementById("o"),n=document.getElementById("n");
    d.min=new Date().toISOString().slice(0,10);
    function chk(){n.disabled=!(d.value&&o.value)}
    d.onchange=o.onchange=chk;
    n.onclick=function(){S.data=d.value;S.ora=o.value;go(3)};
  }
  if(step===3){
    card.innerHTML='<h1>Che cosa ti va? 🍽️</h1><p>Scegli il mood.</p><div class="grid" id="g">'+CFG.cibi.map(function(c){return '<button class="opt" aria-pressed="false">'+c+'</button>'}).join("")+'</div><button class="btn" id="n" disabled>Questo è il mood ✨</button>';
    var n=document.getElementById("n");
    document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
      document.querySelectorAll(".opt").forEach(function(x){x.setAttribute("aria-pressed","false")});
      b.setAttribute("aria-pressed","true");S.cibo=b.textContent;n.disabled=false}});
    n.onclick=function(){go(4)};
  }
  if(step===4){
    card.innerHTML='<div class="big">💗</div><h1>Sono felice che tu non abbia detto no.</h1><p>Non c\'è bisogno di farti bella perché sei già stupenda ❤️</p><div class="fld"><label for="dove">Dove vuoi andare? 📍</label><input type="text" id="dove" placeholder="Scrivi il posto che ti va…"></div><button class="btn" id="n" disabled>Ultimo dettaglio</button><button class="btn ghost" id="sur">Sì padrone, scegli tu 😜</button>';
    var dv=document.getElementById("dove"),n=document.getElementById("n");
    dv.oninput=function(){n.disabled=!dv.value.trim()};
    n.onclick=function(){S.dove=dv.value.trim();go(5)};
    document.getElementById("sur").onclick=function(){S.dove="Sorpresa: sì padrone, scegli tu 😜";go(5)};
  }
  if(step===5){
    var dt=S.data?new Date(S.data+"T12:00:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"}):"";
    card.innerHTML='<h1>Contratto di appuntamento™</h1><p>Ufficialmente 100% reale. Firmato con un sì.</p><div class="doc"><b><span>Quando</span><span>'+dt+', '+S.ora+'</span></b><b><span>Cosa</span><span>'+S.cibo+'</span></b><b><span>Dove</span><span>'+S.dove.replace(/</g,'&lt;')+'</span></b><b><span>Costo</span><span>€ 499 <small>(scherzo)</small></span></b><small>• Un giorno mi ricompenserai, tipo con una cena a tua scelta.</small><small>• Ormai da quando hai accettato, devi esserci 😌</small><small>• Le lamentele vanno presentate durante il dessert.</small><small>• Baci e abbracci inclusi nel prezzo 💗</small></div><button class="btn" id="n">Conferma ✅</button>';
    document.getElementById("n").onclick=function(){
      var msg="Confermato! "+CFG.nome+" ha detto sì 💗\n"+dt+", "+S.ora+" — "+S.cibo+"\nDove: "+S.dove;
      card.innerHTML='<div class="big">🥳</div><h1>Confermato!</h1><p>'+dt+', '+S.ora+'<br>'+S.cibo+'<br>'+S.dove.replace(/</g,'&lt;')+'</p><button class="btn" id="c">Copia il riepilogo</button><p id="m" class="hidden">Copiato! Incollalo a '+CFG.tuoNome+' 💌</p>';
      document.getElementById("c").onclick=function(){
        function ok(){document.getElementById("m").classList.remove("hidden")}
        try{navigator.clipboard.writeText(msg).then(ok,ok)}catch(e){ok()}};
      document.getElementById("prog").style.width="100%";document.getElementById("stepn").textContent="✓";
    };
  }
}
render();
</script>
</body>
</html>
